[package]
name = "fireflychan"
version = "1.0.0"
description = "FireflyChan desktop AI screenshot companion"
authors = ["Q-Ghast"]
license = "MIT"
repository = "https://github.com/Q-Ghast/FireflyChan"
edition = "2021"
rust-version = "1.90"

[lib]
name = "fireflychan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
anyhow = "1"
tauri = { version = "2.12.5", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
xcap = "0.9.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls"] }
futures-util = "0.3"
base64 = "0.22"
keyring = "4"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
] }
